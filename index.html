<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Palmeiras 3x0 Santos!</title>
</head>
<body>
    <main>
        <div class="passo ativo" id="passo-0">
            <img src="cenario-passo0.jpeg" alt="">

            <button class="btn-proximo" data-proximo="1">IR</button>

         <div class="passo" id="passo-1">

            <button class="btn-proximo" data-proximo="3">Sentar!</button>
            <button class="btn-proximo" data-proximo="4">Ficar em pé!</button>
        <div>
        <div class="passo" id="passo-2">
            <img src="images (1).jpeg" alt="">
            <p>Começou o jogo, Palmeiras x Santos!</p>
            <button class="btn-proximo" data-proximo="5">Ficar cantando!</button>

        </div>
